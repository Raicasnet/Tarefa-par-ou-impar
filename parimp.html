<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par ou Ímpar</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <main class="container my-5" style="max-width: 400px;">
        <div class="card shadow-sm p-4">
            <h1 class="h3 mb-4 text-center text-primary fw-bold">Par ou Ímpar</h1>
            
            <form id="parImparForm">
                <div class="mb-3">
                    <label for="innumero" class="form-label fw-semibold">Digite o Número:</label>
                    <input type="number" id="innumero" class="form-control" placeholder="Ex: 42" required>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Verificar</button>
                    <button type="reset" class="btn btn-outline-secondary">Limpar</button>
                </div>
            </form>

            <h2 id="resposta" class="h5 mt-4 text-center text-secondary"></h2>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./parimp.js"></script>
</body>
</html>
